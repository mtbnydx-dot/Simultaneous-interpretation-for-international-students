<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransLive 字幕</title>
    <link rel="stylesheet" href="/assets/overlay.css">
</head>
<body>
    <div class="subtitle-shell">
        <header class="overlay-toolbar">
            <span class="overlay-title" id="overlayTitle">TransLive 字幕</span>
            <span class="overlay-status connecting" id="overlayStatus" title="字幕连接状态">连接中</span>
            <div class="mode-switch" role="group" aria-label="字幕显示模式">
                <button type="button" data-mode="bilingual">双语</button>
                <button type="button" data-mode="translation">仅译文</button>
            </div>
            <span class="overlay-style-readout" id="styleReadout" title="字体 / 窗口 / 背景">100% · 960×260 · 66%</span>
            <div class="overlay-tools" role="group" aria-label="字幕窗样式">
                <button type="button" id="fontDownBtn" title="减小字体" aria-label="减小字体">A-</button>
                <button type="button" id="fontUpBtn" title="增大字体" aria-label="增大字体">A+</button>
                <button type="button" id="fontPresetBtn" title="切换字体" aria-label="切换字体">Aa</button>
                <button type="button" id="fontWeightBtn" title="切换字重" aria-label="切换字重">B</button>
                <button type="button" id="densityBtn" title="切换字幕密度" aria-label="切换字幕密度">≋</button>
                <button type="button" id="bgDownBtn" title="降低背景不透明度" aria-label="降低背景不透明度">◐-</button>
                <button type="button" id="bgUpBtn" title="提高背景不透明度" aria-label="提高背景不透明度">◐+</button>
                <button type="button" id="frameDownBtn" title="缩小字幕窗" aria-label="缩小字幕窗">□-</button>
                <button type="button" id="frameUpBtn" title="放大字幕窗" aria-label="放大字幕窗">□+</button>
                <button type="button" id="resetLayoutBtn" title="恢复默认样式和大小" aria-label="恢复默认样式和大小">↺</button>
                <button type="button" id="mainWindowBtn" title="回到主窗口" aria-label="回到主窗口" hidden>⌂</button>
            </div>
            <button type="button" class="close-btn" id="closeBtn" title="关闭" aria-label="关闭">×</button>
        </header>

        <main class="subtitle-stage" id="subtitleStage" aria-live="polite">
            <div class="subtitle-empty">等待字幕…</div>
        </main>
        <button type="button" class="resize-grip" id="resizeGrip" title="拖拽调整大小" aria-label="拖拽调整大小"></button>
    </div>

    <script src="/assets/overlay.js"></script>
</body>
</html>
