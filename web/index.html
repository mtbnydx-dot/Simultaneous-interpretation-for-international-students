<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransLive · AI 同声传译</title>
    <link rel="stylesheet" href="/assets/style.css?v=1.1">
</head>
<body>
    <div id="app">
        <header>
            <div class="brand">
                <h1>TransLive</h1>
                <span class="tagline">AI 同声传译</span>
                <span class="version-pill" id="versionPill">...</span>
                <span class="credit-line" id="creditLine"></span>
            </div>
            <div class="badges">
                <span class="badge" id="asrBadge" title="ASR 模型">ASR <em>—</em></span>
                <span class="badge" id="mtBadge"  title="MT 模型">MT <em>—</em></span>
                <span class="status" id="status">未连接</span>
            </div>
        </header>

        <section class="controls">
            <div class="control-group">
                <label>源语言</label>
                <select id="sourceLang">
                    <option value="auto">自动检测</option>
                    <option value="en" selected>English</option>
                    <option value="zh">中文</option>
                    <option value="ja">日本語</option>
                    <option value="ko">한국어</option>
                    <option value="de">Deutsch</option>
                    <option value="fr">Français</option>
                    <option value="es">Español</option>
                    <option value="ru">Русский</option>
                    <option value="ar">العربية</option>
                    <option value="pt">Português</option>
                    <option value="it">Italiano</option>
                    <option value="th">ไทย</option>
                    <option value="vi">Tiếng Việt</option>
                    <option value="id">Bahasa Indonesia</option>
                    <option value="hi">हिन्दी</option>
                    <option value="tr">Türkçe</option>
                    <option value="pl">Polski</option>
                    <option value="cs">Čeština</option>
                    <option value="nl">Nederlands</option>
                </select>
            </div>

            <div class="control-center">
                <button id="swapLang" class="btn-icon-only" title="交换语言" aria-label="交换语言">⇄</button>
                <button id="toggleBtn" class="btn-primary">
                    <span class="btn-icon" aria-hidden="true"></span>
                    <span class="btn-label">开始同传</span>
                </button>
            </div>

            <div class="control-group">
                <label>目标语言</label>
                <select id="targetLang">
                    <option value="zh" selected>中文</option>
                    <option value="en">English</option>
                    <option value="ja">日本語</option>
                    <option value="ko">한국어</option>
                    <option value="de">Deutsch</option>
                    <option value="fr">Français</option>
                    <option value="es">Español</option>
                    <option value="ru">Русский</option>
                    <option value="ar">العربية</option>
                    <option value="pt">Português</option>
                    <option value="it">Italiano</option>
                    <option value="th">ไทย</option>
                    <option value="vi">Tiếng Việt</option>
                    <option value="id">Bahasa Indonesia</option>
                    <option value="hi">हिन्दी</option>
                    <option value="tr">Türkçe</option>
                    <option value="pl">Polski</option>
                    <option value="cs">Čeština</option>
                    <option value="nl">Nederlands</option>
                </select>
            </div>
        </section>

        <!-- 术语表面板 -->
        <section class="glossary-section">
            <button id="glossaryToggle" class="btn-secondary glossary-toggle-btn" title="设置术语表">
                术语表
            </button>
            <div class="glossary-panel" id="glossaryPanel">
                <div class="glossary-header">
                    <span>术语对照表</span>
                    <span class="muted">自定义翻译词汇</span>
                </div>
                <div class="glossary-rows" id="glossaryRows"></div>
                <div class="glossary-actions">
                    <button id="glossaryAddBtn" class="btn-secondary">+ 添加</button>
                    <button id="glossaryApplyBtn" class="btn-primary glossary-apply-btn">应用</button>
                </div>
            </div>
        </section>

        <section class="history-section">
            <div class="history-panel" id="historyPanel" hidden>
                <div class="history-header">
                    <div>
                        <span>历史记录</span>
                        <span class="muted" id="historyStatus">尚未读取</span>
                    </div>
                    <div class="history-actions">
                        <input id="historySearch" class="history-search" type="search" placeholder="搜索历史" autocomplete="off" aria-label="搜索历史记录">
                        <select id="historyStateFilter" class="history-filter" title="历史状态" aria-label="历史状态">
                            <option value="all">全部</option>
                            <option value="final">完成</option>
                            <option value="error">错误</option>
                        </select>
                        <button id="historyRefreshBtn" class="btn-secondary">刷新</button>
                        <button id="historyCopyFilteredBtn" class="btn-secondary">复制筛选</button>
                        <button id="historyExportFilteredBtn" class="btn-secondary">导出筛选</button>
                        <button id="historyLoadBtn" class="btn-primary history-load-btn">载入</button>
                        <button id="historyClearSavedBtn" class="btn-secondary history-danger-btn">清空保存</button>
                    </div>
                </div>
                <div class="history-list" id="historyList">
                    <div class="history-empty">暂无历史记录</div>
                </div>
            </div>
        </section>

        <section class="fulltext-section">
            <div class="fulltext-panel" id="fullTextPanel" hidden>
                <div class="fulltext-header">
                    <div>
                        <span>全文翻译</span>
                        <span class="muted" id="fullTextStatus">将本次全部原文合并后整体翻译</span>
                    </div>
                    <div class="fulltext-actions">
                        <button id="fullTextGenerateBtn" class="btn-primary fulltext-generate-btn">生成全文翻译</button>
                        <button id="fullTextCopyBtn" class="btn-secondary">复制</button>
                        <button id="fullTextExportBtn" class="btn-secondary">导出 .txt</button>
                        <button id="fullTextCloseBtn" class="btn-secondary">关闭</button>
                    </div>
                </div>
                <div class="fulltext-body" id="fullTextBody">
                    <div class="fulltext-empty">当前没有全文翻译。点击「生成全文翻译」后，会把本次所有原文合并成一篇内容再统一翻译。</div>
                </div>
            </div>
        </section>

        <section class="meter-row">
            <div class="meter" id="meter" aria-hidden="true">
                <div class="meter-bar" id="meterBar"></div>
            </div>
            <span class="hint" id="hint">点击「开始同传」并允许麦克风权限</span>
        </section>

        <main class="transcript" id="transcript" tabindex="0">
            <div class="empty-state" id="emptyState">
                <div class="empty-icon"></div>
                <p>等待第一段语音…</p>
                <p class="muted">说话或播放音频，识别结果会成对显示在这里。</p>
            </div>
        </main>

        <button class="jump-pill" id="jumpPill" hidden>↑ 跳到最新</button>

        <footer>
            <div class="footer-left">
                <button id="clearBtn"  class="btn-secondary">清空</button>
                <button id="copyBtn"   class="btn-secondary">复制全部</button>
                <button id="exportTxt" class="btn-secondary">导出 .txt</button>
                <button id="exportSrt" class="btn-secondary">导出 .srt</button>
                <button id="fullTextToggle" class="btn-secondary">全文翻译</button>
                <button id="historyToggle" class="btn-secondary">历史记录</button>
                <button id="modelDownloadBtn" class="btn-secondary">加载/下载模型</button>
                <button id="modelUnloadBtn" class="btn-secondary">释放内存</button>
                <div class="audio-source-controls">
                    <select id="audioSource" class="footer-select audio-source-select" title="音频输入" aria-label="音频输入">
                        <option value="system" selected>系统音频</option>
                        <option value="mic">麦克风</option>
                    </select>
                    <span id="audioSourceStatus" class="audio-source-status warn" title="系统音频状态">检测中</span>
                    <select id="latencyMode" class="footer-select latency-mode-select" title="识别延迟模式" aria-label="识别延迟模式">
                        <option value="low">低延迟</option>
                        <option value="balanced" selected>均衡</option>
                        <option value="stable">稳妥</option>
                    </select>
                </div>
                <div class="subtitle-controls">
                    <select id="subtitleMode" class="footer-select" title="字幕显示模式" aria-label="字幕显示模式">
                        <option value="bilingual" selected>双语</option>
                        <option value="translation">仅译文</option>
                    </select>
                    <button id="subtitleWindowBtn" class="btn-secondary">字幕窗</button>
                    <label class="toggle" id="clickThroughWrap" hidden>
                        <input type="checkbox" id="clickThrough">
                        <span title="开启后点击字幕正文会穿透到下面的应用；字幕窗的工具栏和右下角缩放手柄仍然可以正常操作">点击穿透</span>
                    </label>
                </div>
                <label class="toggle">
                    <input type="checkbox" id="autoScroll" checked>
                    <span>自动滚动</span>
                </label>
                <label class="toggle history-toggle">
                    <input type="checkbox" id="persistHistory" checked>
                    <span>保存记录</span>
                </label>
                <label class="toggle auto-unload-toggle" title="空闲一段时间后自动释放模型内存">
                    <input type="checkbox" id="autoUnload" checked>
                    <span>空闲释放</span>
                </label>
                <label class="toggle streaming-preview-toggle" title="滚动显示尚未定稿的识别文本">
                    <input type="checkbox" id="streamingPreview">
                    <span>流式预览 <small>实验</small></span>
                </label>
            </div>
            <div class="footer-right">
                <span class="history-info" id="historyInfo">记录 0</span>
                <span id="stats">—</span>
            </div>
        </footer>

        <div class="hotkeys" aria-hidden="true">空格 ⇄ 开始 / 停止</div>

        <div class="modal-backdrop" id="modelPrompt" hidden>
            <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modelPromptTitle">
                <button id="modelPromptClose" class="modal-close btn-icon-only" title="关闭" aria-label="关闭">×</button>
                <div class="modal-kicker">首次使用</div>
                <h2 id="modelPromptTitle">加载/下载模型</h2>
                <p id="modelPromptText">
                    安装包不内置大模型。需要加载或下载语音识别和翻译模型后才能开始同传。
                </p>
                <div class="model-file" id="modelPromptModel">语音识别模型 / 翻译模型</div>
                <div class="modal-actions">
                    <button id="modelPromptLater" class="btn-secondary">稍后</button>
                    <button id="modelPromptDownload" class="btn-primary">加载/下载模型</button>
                </div>
            </section>
        </div>
    </div>

    <template id="cardTemplate">
        <article class="card" data-seg="">
            <header class="card-head">
                <time class="ts"></time>
                <span class="lang-pair"></span>
                <span class="metrics muted"></span>
            </header>
            <div class="row original">
                <span class="row-tag">原</span>
                <p class="text"></p>
            </div>
            <div class="row translated pending">
                <span class="row-tag">译</span>
                <p class="text"><span class="dots"><i></i><i></i><i></i></span></p>
            </div>
        </article>
    </template>

    <script src="/assets/app.js?v=1.1"></script>
</body>
</html>
